name: Validar SQL

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-sql:
    name: SQLFluff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Revisar migraciones
        run: sqlfluff lint db/migrations

      - name: Validar tipos prohibidos
        run: python scripts/validate_sql.py db/migrations
